# ==========================================================
#  LOGS
# ==========================================================
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
spring.main.banner-mode=off
spring.main.log-startup-info=false

# ==========================================================
#  BANCO DE DADOS (MySQL)
#  -> ajuste usuario/senha de acordo com o seu ambiente
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/av1DW3?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
#  JPA / HIBERNATE
# ==========================================================
# exibir SQL gerado no console
spring.jpa.show-sql=false
# deixar o SQL identado quando exibido
spring.jpa.properties.hibernate.format_sql=true
# recria as tabelas a cada inicializacao
spring.jpa.hibernate.ddl-auto=create-drop

server.error.include-stacktrace=never
